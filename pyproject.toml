[project]
name = "agency-cup"
version = "0.1.0"
description = "Team kit for the Agency Cup: build an AI detective agent"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai-agents>=0.15,<1",
    "openai>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "google-adk>=2.2",
    "litellm>=1.75", # lets Google ADK use NVIDIA and OpenAI models
    "ipykernel>=6.29", # lets VS Code, Cursor and Jupyter run the notebook in this environment
    "langchain-mcp-adapters>=0.3.2",
    "crewai>=1.15.41",
    "fastmcp>=3.4.11",
    "langgraph>=1.2.18",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agency_kit", "starters"]  # uv sync installs both, so imports work from any folder

[tool.uv]
package = true
